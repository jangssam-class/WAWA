backend:
  name: git-gateway
  branch: main

site_url: "https://wawa-academy.netlify.app"
display_url: "https://wawa-academy.netlify.app"
locale: ko
publish_mode: simple
show_preview_links: false
media_folder: "images/blog"
public_folder: "/images/blog"

collections:
  - name: "education_posts"
    label: "WAWA 교육정보 포스팅"
    folder: "content/posts"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    slug: "{{fields.slug}}"
    summary: "{{date}} · {{region}} · {{category}} · {{title}}"
    fields:
      - { label: "✨ 자동 포스팅 작성", name: "_helper", widget: "wawa_autofill", required: false }
      - { label: "주소용 영문 이름", name: "slug", widget: "wawa_string_autofill", required: true, hint: "영문 소문자·숫자·하이픈만 사용" }
      - { label: "제목", name: "title", widget: "wawa_string_autofill", required: true }
      - { label: "작성일", name: "date", widget: "wawa_datetime_autofill", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: true }
      - { label: "지역", name: "region", widget: "wawa_string_autofill", required: false }
      - label: "대상"
        name: "target"
        widget: "wawa_select_autofill"
        required: true
        options: ["초등학생", "중학생", "고등학생", "초중등", "중고등", "초중고"]
      - label: "카테고리"
        name: "category"
        widget: "wawa_select_autofill"
        required: true
        options: ["국어", "영어", "수학", "과학", "사회", "국영수", "전과목", "학습관리", "학원선택", "교육소식"]
      - { label: "검색결과·목록 요약", name: "excerpt", widget: "wawa_text_autofill", required: true }
      - { label: "AI 검색 핵심답변", name: "answer", widget: "wawa_text_autofill", required: true }
      - { label: "세부키워드", name: "detailKeywords", widget: "hidden", required: false, default: [] }
      - label: "🏫 홍보 대상 센터 (정식명칭·교육청 등록번호 자동 표시)"
        name: "centerKey"
        widget: "select"
        required: false
        default: ""
        hint: "특정 학원 홍보글은 반드시 해당 센터를 선택하세요. 지역명만 보고 임의로 연결하지 않습니다."
